<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" />
    <title>İletişim - Erdem Gir</title>
</head>
  <body>
    <div id="container">
      <h1>İletişim</h1>
      
      <div class="main-content">
        <!-- Sol Taraf - Resim -->
        <div class="img-container">
          <img src="public/images/Resim1.png" alt="Erdem Gir Profil Fotoğrafı" class="tolstoy-image" />
          <p>Matematik Öğretmeni & IT Uzmanı</p>
          
          <nav>
            <ul>
              <li><a href="index.html">Ana Sayfa</a></li>
              <li><a href="project.html">Projeler</a></li>
              <li><a href="about.html">Hakkımda</a></li>
              <li><a href="contact.html">İletişim</a></li>
            </ul>
          </nav>
        </div>

        <!-- Sağ Taraf - İçerik -->
        <div class="content-area">
          <section>
            <h2>İletişim Formu</h2>
            <form action="mailto:erdematina@gmail.com" method="post" enctype="text/plain">
                
                <fieldset>
                    <legend>Kişisel Bilgiler</legend>
                    
                    <label for="name">Ad Soyad:</label>
                    <input type="text" id="name" name="name" required>
                    
                    <label for="email">E-posta:</label>
                    <input type="email" id="email" name="email" required>
                    
                    <label for="phone">Telefon:</label>
                    <input type="tel" id="phone" name="phone" placeholder="0555 123 45 67">
                </fieldset>
                
                <fieldset>
                    <legend>Mesaj Detayları</legend>
                    
                    <label for="subject">Konu:</label>
                    <select id="subject" name="subject" required>
                        <option value="">Seçiniz...</option>
                        <option value="is_teklifi">İş Teklifi</option>
                        <option value="proje_teklifi">Proje Teklifi</option>
                        <option value="danismanlik">Danışmanlık</option>
                        <option value="sorular">Sorular</option>
                        <option value="diger">Diğer</option>
                    </select>
                    
                    <label for="message">Mesajınız:</label>
                    <textarea id="message" name="message" rows="6" placeholder="Mesajınızı buraya yazınız..." required></textarea>
                </fieldset>
                
                <input type="submit" value="Gönder">
                <input type="reset" value="Temizle">
            </form>
          </section>
        </div>
      </div>

      <footer>
        <p>Tüm Hakları Saklıdır. 2025</p>
        <p><strong>Erdem Gir</strong></p>
      </footer>
    </div>
  </body>
</html>
